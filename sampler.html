<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sampling Gallery</title>
  <meta name="description" content="Watch sampling algorithms explore a landscape in real time — proposals, trajectories, gradients and adaptation, live and tunable." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Sampling Gallery — interactive sampler" />
  <meta property="og:description" content="Watch sampling algorithms explore a landscape in real time — proposals, trajectories, gradients and adaptation, live and tunable." />
  <meta property="og:image" content="https://chris-nemeth.github.io/sampling-viz/docs/og-card.png" />
  <meta property="og:url" content="https://chris-nemeth.github.io/sampling-viz/sampler.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ---- Broadsheet chrome around the real engine (Simulation + Visualizer) ---- */
    html, body { margin: 0; height: 100%; }
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); overflow: hidden; }
    #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    #app.railHidden { grid-template-columns: 1fr; }
    #app.railHidden #rail { display: none; }

    /* rail */
    #rail { background: var(--color-surface, #fff); border-right: 1px solid var(--color-divider); padding: 20px 20px 24px; overflow-y: auto; }
    .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-neutral-600); }
    .brand { font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 1.1; margin: 4px 0 16px; }
    .railTop { display: flex; justify-content: space-between; align-items: baseline; }
    #hideRail { background: none; border: 0; font: inherit; font-size: 13px; color: var(--color-accent); cursor: pointer; padding: 0; }
    .hr { height: 1px; background: var(--color-divider); border: 0; margin: 16px 0; }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; }
    .sec-head h4 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-700); margin: 0; }
    .sec-head span { font-size: 12px; color: var(--color-neutral-600); }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { border: 1px solid var(--color-divider); border-radius: 4px; background: #fff; cursor: pointer; position: relative; transition: border-color .12s; padding: 12px 6px; text-align: center; font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--color-accent-600, #0088b0); }
    .tile:hover { border-color: var(--color-accent-400, #4aa8c4); }
    .tile.on { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent); }
    .tile .dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 0 2px #fff; }
    .tileGroup { grid-column: 1 / -1; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-600); margin: 8px 0 -2px; }
    .tileGroup:first-child { margin-top: 0; }

    #targets { display: grid; grid-template-columns: repeat(3, 1fr); }

    .params .field { margin-bottom: 12px; }
    .params .flabel { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-neutral-700); margin-bottom: 4px; }
    .params .flabel .val { color: var(--color-accent); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--color-accent); }
    .params select { width: 100%; font: inherit; padding: 4px 6px; border: 1px solid var(--color-divider); border-radius: 4px; background: #fff; color: inherit; }
    .params .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-neutral-700); }
    .params .check input { accent-color: var(--color-accent); }

    .controls { display: flex; gap: 8px; margin-top: 6px; }
    .controls .btn { flex: 1; }

    .legend { font-size: 12px; color: var(--color-neutral-600); margin-top: 16px; line-height: 1.8; }
    .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

    /* main */
    #main { position: relative; overflow: hidden; }
    #wrap { position: absolute; inset: 0; }
    #wrap canvas { position: absolute; top: 0; left: 0; }
    #plot3d { display: none; cursor: grab; }
    #plot3d:active { cursor: grabbing; }
    #topbar { position: absolute; top: 22px; left: 26px; right: 26px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; gap: 14px; }
    #topbar .left { display: flex; gap: 14px; align-items: flex-start; }
    #reopen { pointer-events: auto; display: none; }
    #nowSampling { max-width: 46em; }
    #nowSampling .kicker { color: var(--color-accent); }
    #nowSampling h2 { font-family: var(--font-heading); font-weight: 600; font-size: 30px; margin: 2px 0 8px; }
    #nowSampling p { font-size: 14px; color: var(--color-neutral-700); margin: 0; line-height: 1.4; }
    #viewToggle { pointer-events: auto; display: flex; border: 1px solid var(--color-divider); border-radius: 6px; overflow: hidden; background: #fff; flex: none; }
    #viewToggle button { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border: 0; background: #fff; color: var(--color-neutral-700); cursor: pointer; }
    #viewToggle button.on { background: var(--color-accent); color: #fff; }

    #statsBox { position: absolute; left: 26px; bottom: 22px; background: rgba(255,255,255,.85); border: 1px solid var(--color-divider); border-radius: 6px; padding: 10px 16px; display: flex; gap: 8px 26px; flex-wrap: wrap; max-width: min(720px, calc(100% - 52px)); backdrop-filter: blur(3px); }
    #statsBox #stNote { flex-basis: 100%; font-size: 12.5px; font-style: italic; color: var(--color-neutral-600); display: none; }
    #statsBox .stat .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-600); }
    #statsBox .stat .v { font-family: var(--font-heading); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
    #statsBox .stat .v.acc { color: var(--color-accent); }
    #hint { position: absolute; right: 26px; bottom: 24px; font-size: 12px; color: var(--color-neutral-500); }
    #notesBtn { pointer-events: auto; margin-top: 6px; background: none; border: none; padding: 0; font: inherit; font-size: 13px; color: var(--color-accent); cursor: pointer; letter-spacing: .02em; }
    #notesBtn:hover { color: var(--color-accent-700); text-decoration: underline; }
    #notesPanel { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 90%); background: #fff; border-left: 1px solid var(--color-divider); box-shadow: -6px 0 24px rgba(0,0,0,.07); transform: translateX(102%); transition: transform .25s ease; z-index: 40; display: flex; flex-direction: column; }
    #notesPanel.open { transform: translateX(0); }
    #notesPanel .np-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 20px 10px; border-bottom: 2px solid var(--color-text); }
    #notesPanel .np-head .kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-accent-700); }
    #notesPanel .np-close { background: none; border: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--color-neutral-600); padding: 2px 6px; }
    #notesPanel .np-close:hover { color: var(--color-text); }
    #notesBody { overflow-y: auto; padding: 6px 22px 18px; font-size: 14px; line-height: 1.55; color: var(--color-neutral-800); }
    #notesBody h1 { font-size: 21px; line-height: 1.15; margin: 14px 0 4px; }
    #notesBody h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700); margin: 18px 0 6px; border-top: 1px solid var(--color-divider); padding-top: 10px; }
    #notesBody p { margin: 8px 0; }
    #notesBody ul { margin: 8px 0; padding-left: 20px; }
    #notesBody li { margin: 4px 0; }
    #notesBody strong { font-family: var(--font-heading); }
    #notesBody code { font-size: 13px; background: var(--color-neutral-100, #f2f2f2); padding: 0 3px; border-radius: 2px; }
    #notesPanel .np-foot { border-top: 1px solid var(--color-divider); padding: 10px 22px; font-size: 12.5px; }

    /* engine-required elements we don't display */
    #info { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="rail">
      <div class="railTop">
        <div class="kicker">Interactive Gallery</div>
        <button id="hideRail" type="button">&lsaquo; Hide</button>
      </div>
      <div class="brand">The Sampling<br />Gallery</div>
      <hr class="hr" />

      <div class="sec-head"><h4>Sampler</h4><span id="algoCount"></span></div>
      <div class="tiles" id="tiles"></div>

      <hr class="hr" />
      <div class="sec-head"><h4>Target distribution</h4></div>
      <div class="seg" id="targets" style="width:100%;"></div>

      <hr class="hr" />
      <div class="sec-head"><h4>Algorithm parameters</h4></div>
      <div class="params" id="params"></div>

      <hr class="hr" />
      <div class="sec-head"><h4>Simulation</h4></div>
      <div class="params">
        <div class="field">
          <div class="flabel"><span>Autoplay delay</span><span class="val" id="delayVal"></span></div>
          <input type="range" id="delay" min="0" max="1000" step="10" />
        </div>
        <div class="field">
          <div class="flabel"><span>Colormap</span></div>
          <select id="cmap"></select>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="play"></button>
        <button class="btn btn-secondary" id="step">Step</button>
        <button class="btn btn-secondary" id="reset">Reset</button>
      </div>
      <div class="controls">
        <button class="btn btn-secondary btn-block" id="savePNG">Save PNG</button>
      </div>

      <div class="legend">
        <div><span class="sw" style="background:#0072b2"></span>Accepted move</div>
        <div><span class="sw" style="background:#d55e00"></span>Rejected proposal</div>
        <div><span class="sw" style="background:#999"></span>Proposal / trajectory</div>
      </div>
    </aside>

    <section id="main">
      <div id="wrap"><canvas id="plotCanvas"></canvas><canvas id="plot3d"></canvas></div>
      <div id="topbar">
        <div class="left">
          <button class="btn btn-secondary" id="reopen">&rsaquo; Show panel</button>
          <div id="nowSampling">
            <div class="kicker">Now sampling</div>
            <h2 id="curName"></h2>
            <p id="curDesc"></p>
            <button id="notesBtn" type="button">Notes &rsaquo;</button>
          </div>
        </div>
        <div id="viewToggle">
          <button id="btn2d" class="on" type="button">2D</button>
          <button id="btn3d" type="button">3D</button>
        </div>
      </div>
      <div id="statsBox">
        <div class="stat"><div class="k">Steps</div><div class="v" id="stSteps">0</div></div>
        <div class="stat"><div class="k">Accept</div><div class="v acc" id="stAcc">—</div></div>
        <div class="stat"><div class="k">Mean</div><div class="v" id="stMean">(0.00, 0.00)</div></div>
        <div class="stat"><div class="k">ESS</div><div class="v" id="stEss">—</div></div>
        <!-- algorithm-specific metrics from the overlay event render here -->
        <div id="stExtra" style="display: contents"></div>
        <div id="stNote"></div>
      </div>
      <div id="hint"></div>
      <aside id="notesPanel" aria-label="Sampler notes">
        <div class="np-head">
          <span class="kicker">Field notes</span>
          <button class="np-close" type="button" title="Close notes">&times;</button>
        </div>
        <div id="notesBody"></div>
        <div class="np-foot"><a id="notesFull" href="notes.html">All field notes &rarr;</a></div>
      </aside>
      <div id="info"></div>
    </section>
  </div>

  <!-- the real engine -->
  <script src="lib/linalg.core.js"></script>
  <script src="lib/linalg.opt.js"></script>
  <script src="lib/canvas-5-polyfill.js"></script>
  <script src="lib/conrec.min.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="main/MultivariateNormal.js"></script>
  <script src="main/Colormaps.js"></script>
  <script src="main/MCMC.js"></script>
  <script src="main/Simulation.js"></script>
  <script src="main/Visualizer.js"></script>
  <script src="algorithms/RandomWalkMH.js"></script>
  <script src="algorithms/RejectionSampling.js"></script>
  <script src="algorithms/ImportanceSampling.js"></script>
  <script src="algorithms/QuasiMonteCarlo.js"></script>
  <script src="algorithms/SliceSampling.js"></script>
  <script src="algorithms/EllipticalSlice.js"></script>
  <script src="algorithms/AAPS.js"></script>
  <script src="algorithms/ParVI-common.js"></script>
  <script src="algorithms/CoinSVGD.js"></script>
  <script src="algorithms/WassersteinParticleDescent.js"></script>
  <script src="algorithms/SPOS.js"></script>
  <script src="algorithms/RiemannianHMC.js"></script>
  <script src="algorithms/ParallelTempering.js"></script>
  <script src="algorithms/TemperedSMC.js"></script>
  <script src="algorithms/AdaptiveMH.js"></script>
  <script src="algorithms/HamiltonianMC.js"></script>
    <script src="algorithms/NUTS.js"></script>
  <script src="algorithms/MALA.js"></script>
  <script src="algorithms/ULA.js"></script>
  <script src="algorithms/SGLD.js"></script>
  <script src="algorithms/FUSE-ULA.js"></script>
  <script src="algorithms/H2MC.js"></script>
  <script src="algorithms/GibbsSampling.js"></script>
  <script src="algorithms/EnsembleMCMC.js"></script>
  <script src="algorithms/ZigZag.js"></script>
  <script src="algorithms/BouncyParticle.js"></script>
  <script src="algorithms/SVGD.js"></script>
  <script src="algorithms/NSRadFriends.js"></script>

  <script>
    "use strict";

    // Every algorithm registered with the engine. `label` is the short name
    // shown on the rail tile; `name` is the full title in the header panel.
    const SAMPLERS = [
      { group: "Independent Monte Carlo", id: "RejectionSampling", label: "Rejection", name: "Rejection Sampling", desc: "Proposes from a simple density and keeps each draw with probability p/(Mq) — exact independent samples, and a lesson in why MCMC is needed." },
      { group: "Independent Monte Carlo", id: "ImportanceSampling", label: "Importance", name: "Importance Sampling", desc: "Keeps every proposal draw but weights it by p/q; watch the weighted effective sample size collapse when the proposal is misplaced. SIR resampling and Pareto-smoothed weights (PSIS, with the k\u0302 diagnostic) as toggles." },
      { group: "Independent Monte Carlo", id: "QuasiMonteCarlo", label: "QMC", name: "Quasi-Monte Carlo", desc: "Replaces pseudorandom proposal draws with a low-discrepancy Halton point set mapped through the proposal — evenly stratified samples and lower-variance weighted estimates. Flip back to pseudorandom to compare." },
      { group: "MCMC", id: "RandomWalkMH", label: "RWMH", name: "Random Walk Metropolis–Hastings", desc: "Proposes a blind Gaussian hop and accepts it with a probability set by the density ratio." },
      { group: "MCMC", id: "AdaptiveMH", label: "Adaptive MH", name: "Adaptive Metropolis", desc: "Random-walk Metropolis that learns its proposal covariance on the fly from the chain's own history." },
      { group: "MCMC", id: "HamiltonianMC", label: "HMC", name: "Hamiltonian Monte Carlo", desc: "Simulates a frictionless particle rolling across the negative log-density, using gradients for long, informed leaps. Optionally tunes its own step size by dual averaging." },
      { group: "MCMC", id: "NUTS", label: "NUTS", name: "No-U-Turn Sampler", desc: "Hamiltonian dynamics that recursively double the trajectory and stop when the path doubles back, with self-tuned step size — the configuration used by Stan. Tree implementation and adaptation are advanced options." },
      { group: "MCMC", id: "RiemannianHMC", label: "RMHMC", name: "Riemannian-Manifold HMC", desc: "HMC on a position-dependent metric (SoftAbs of the local Hessian): the ellipses show the sampler's notion of distance deforming with the target's curvature. Watch it traverse the funnel's neck where fixed-metric HMC stalls." },
      { group: "MCMC", id: "AAPS", label: "AAPS", name: "Apogee-to-Apogee Path Sampler", desc: "A simpler, tuning-robust alternative to NUTS: the leapfrog path is cut into segments at its apogees, the current point sits in a random window of K+1 segments, and a proposal is drawn from the whole path weighted by distance and density." },
      { group: "MCMC", id: "MALA", label: "MALA", name: "Metropolis-adjusted Langevin", desc: "Nudges each proposal uphill along the gradient, then applies a Metropolis correction to stay exact." },
      { group: "MCMC", id: "SliceSampling", label: "Slice", name: "Slice Sampling", desc: "Draws a height under the density curve, then samples uniformly from the horizontal slice at that height, adapting its step size automatically." },
      { group: "MCMC", id: "EllipticalSlice", label: "Ell. Slice", name: "Elliptical Slice Sampling", desc: "Slice-samples the angle around an ellipse through the current state and a Gaussian draw — rejection-free, with no step size to tune. The target is split as Gaussian prior × residual likelihood." },
      { group: "MCMC", id: "GibbsSampling", label: "Gibbs", name: "Gibbs Sampling", desc: "Updates one coordinate at a time from its full conditional, sweeping through the dimensions." },
      { group: "MCMC", id: "H2MC", label: "H2MC", name: "Hessian–Hamiltonian Monte Carlo", desc: "Uses local curvature to shape long anisotropic Gaussian proposals, following approximate Hamiltonian flow." },
      { group: "MCMC", id: "ULA", label: "ULA", name: "Unadjusted Langevin Algorithm", desc: "Follows the gradient with injected noise and never rejects — fast, but slightly biased near the target." },
      { group: "MCMC", id: "SGLD", label: "SGLD", name: "Stochastic Gradient Langevin Dynamics", desc: "Langevin dynamics driven by noisy (mini-batch-style) gradients — the workhorse for large-scale Bayesian learning. Toggle control variates to anchor the gradient at the mode so the noise vanishes there." },
      { group: "MCMC", id: "FUSE-ULA", label: "FUSE-ULA", name: "Tuning-free ULA (FUSE)", desc: "Unadjusted Langevin whose step size adapts itself with a distance-over-gradients schedule — no manual step size tuning required." },
      { group: "Ensemble & multimodal", id: "EnsembleMCMC", label: "Ensemble", name: "Ensemble MCMC", desc: "An interacting ensemble of walkers proposing from each other's positions — affine-invariant stretch moves (emcee) or differential-evolution moves, so correlated targets come for free." },
      { group: "Ensemble & multimodal", id: "ParallelTempering", label: "PT", name: "Parallel Tempering", desc: "Runs replicas at rising temperatures and swaps them — hot chains cross between modes and hand the discovery down to the cold chain." },
      { group: "Sequential & annealed", id: "TemperedSMC", label: "SMC / AIS", name: "Tempered Sequential Monte Carlo", desc: "A weighted particle cloud anneals from an easy reference to the target through reweighting, resampling and MCMC rejuvenation. Switch to Annealed IS to run the same ladder without resampling — and watch the ESS decay." },
      { group: "Sequential & annealed", id: "NestedSampling", label: "Nested", name: "Nested Sampling", desc: "A population of live points climbs likelihood shells, replacing the worst point with a draw from the constrained region (built here with RadFriends bubbles)." },
      { group: "Non-reversible", id: "ZigZag", label: "Zig-Zag", name: "Zig-Zag Sampler", desc: "A non-reversible continuous-time sampler: straight lines with ±1 velocities, switching direction at gradient-driven random events." },
      { group: "Non-reversible", id: "BouncyParticle", label: "BPS", name: "Bouncy Particle Sampler", desc: "A non-reversible particle that travels in straight lines and reflects off the gradient at random bounce times, with velocity refreshment." },
      { group: "Particle methods", id: "SVGD", label: "SVGD", name: "Stein Variational Gradient Descent", desc: "A cloud of particles moves together, pushed toward the density and apart from one another." },
      { group: "Particle methods", id: "CoinSVGD", label: "Coin SVGD", name: "Coin Stein Variational Gradient Descent", desc: "SVGD without a learning rate: each particle coordinate is a coin-betting gambler whose step size emerges from its own drift history. Same kernel and drift as SVGD — only the optimizer differs." },
      { group: "Particle methods", id: "WassersteinParticleDescent", label: "WPD", name: "Wasserstein Particle Descent", desc: "Particle discretizations of the Wasserstein gradient flow of KL: raw target attraction plus a kernel-density entropy force. Switch between the Blob, GFSD and GFSF constructions and compare their KSD." },
      { group: "Particle methods", id: "SPOS", label: "SPOS", name: "Stochastic Particle-Optimization Sampling", desc: "SVGD transport plus Langevin noise — a bridge between deterministic particle flow (τ = 0) and stochastic exploration. The noise counters deterministic particle collapse." },
    ];
    // old deep links keep working: variants folded into unified samplers
    const LEGACY_IDS = {
      NaiveNUTS: "NUTS",
      EfficientNUTS: "NUTS",
      DualAveragingNUTS: "NUTS",
      DualAveragingHMC: "HamiltonianMC",
      "SGLD-CV": "SGLD",
      MicrocanonicalHamiltonianMC: "HamiltonianMC",
      "DE-MCMC-Z": "EnsembleMCMC",
      "RadFriends-NS": "NestedSampling",
    };
    const TARGETS = [
      { id: "banana", label: "Banana" },
      { id: "donut", label: "Donut" },
      { id: "standard", label: "Gauss" },
      { id: "multimodal", label: "Mix" },
      { id: "funnel", label: "Funnel" },
      { id: "squiggle", label: "Squiggle" },
      { id: "flower", label: "Flower" },
      { id: "swissroll", label: "Swiss Roll" },
      { id: "ridge", label: "Ridge" },
    ];

    // Minimal stand-in for the lil-gui folder API that the algorithms'
    // attachUI(self, folder) expects, rendering design-styled controls instead:
    //   folder.add(obj, prop)            -> checkbox   (boolean prop)
    //   folder.add(obj, prop, [a, b])    -> select
    //   folder.add(obj, prop, min, max)  -> slider
    // with chainable .step() .name() .onChange() .listen() and no-op .open().
    function makeFolder(container) {
      return {
        open() {},
        add(obj, prop, a, b) {
          const field = document.createElement("div");
          field.className = "field";
          container.appendChild(field);
          const ctrl = { _cb: null };
          ctrl.onChange = (f) => ((ctrl._cb = f), ctrl);
          ctrl.listen = () => ctrl;

          if (Array.isArray(a)) {
            const flabel = document.createElement("div");
            flabel.className = "flabel";
            const nameEl = document.createElement("span");
            nameEl.textContent = prop;
            flabel.appendChild(nameEl);
            const select = document.createElement("select");
            a.forEach((opt) => {
              const o = document.createElement("option");
              o.value = opt; o.textContent = opt; o.selected = obj[prop] === opt;
              select.appendChild(o);
            });
            select.addEventListener("change", () => { obj[prop] = select.value; if (ctrl._cb) ctrl._cb(select.value); });
            field.appendChild(flabel); field.appendChild(select);
            ctrl.name = (n) => ((nameEl.innerHTML = n), ctrl);
            ctrl.step = () => ctrl;
            return ctrl;
          }

          if (typeof obj[prop] === "boolean") {
            const lab = document.createElement("label");
            lab.className = "check";
            const input = document.createElement("input");
            input.type = "checkbox"; input.checked = obj[prop];
            const nameEl = document.createElement("span");
            nameEl.textContent = prop;
            input.addEventListener("change", () => { obj[prop] = input.checked; if (ctrl._cb) ctrl._cb(input.checked); });
            lab.appendChild(input); lab.appendChild(nameEl); field.appendChild(lab);
            ctrl.name = (n) => ((nameEl.innerHTML = n), ctrl);
            ctrl.step = () => ctrl;
            return ctrl;
          }

          const min = a, max = b;
          const flabel = document.createElement("div");
          flabel.className = "flabel";
          const nameEl = document.createElement("span");
          nameEl.textContent = prop;
          const valEl = document.createElement("span");
          valEl.className = "val";
          flabel.appendChild(nameEl); flabel.appendChild(valEl);
          const input = document.createElement("input");
          input.type = "range"; input.min = min; input.max = max;
          input.step = (max - min) / 100; input.value = obj[prop];
          const fmt = (v) => (+input.step >= 1 ? Math.round(v) : (+v).toFixed(3).replace(/0+$/, "").replace(/\.$/, ""));
          valEl.textContent = fmt(obj[prop]);
          input.addEventListener("input", () => {
            obj[prop] = +input.value; valEl.textContent = fmt(+input.value);
            if (ctrl._cb) ctrl._cb(+input.value);
          });
          field.appendChild(flabel); field.appendChild(input);
          ctrl.name = (n) => ((nameEl.innerHTML = n), ctrl);
          ctrl.step = (s) => ((input.step = s), (input.value = obj[prop]), (valEl.textContent = fmt(obj[prop])), ctrl);
          return ctrl;
        },
      };
    }

    function renderTiles() {
      const el = document.getElementById("tiles");
      el.innerHTML = "";
      let lastGroup = null;
      SAMPLERS.forEach((a) => {
        if (a.group !== lastGroup) {
          lastGroup = a.group;
          const g = document.createElement("div");
          g.className = "tileGroup";
          g.textContent = a.group;
          el.appendChild(g);
        }
        const on = a.id === sim.algorithm;
        const tile = document.createElement("div");
        tile.className = "tile" + (on ? " on" : "");
        tile.textContent = a.label;
        tile.title = a.name;
        if (on) { const d = document.createElement("div"); d.className = "dot"; tile.appendChild(d); }
        tile.addEventListener("click", () => selectSampler(a.id));
        el.appendChild(tile);
      });
      document.getElementById("algoCount").textContent = SAMPLERS.length + " algorithms";
    }

    function renderTargets() {
      const el = document.getElementById("targets");
      el.innerHTML = "";
      TARGETS.forEach((t) => {
        const lab = document.createElement("label");
        lab.className = "seg-opt";
        lab.style.justifyContent = "center";
        const input = document.createElement("input");
        input.type = "radio"; input.name = "tgt"; input.checked = t.id === sim.target;
        input.addEventListener("change", () => { sim.setTarget(t.id); surf3d = null; evt3d = null; });
        const span = document.createElement("span"); span.textContent = t.label;
        lab.appendChild(input); lab.appendChild(span);
        el.appendChild(lab);
      });
    }

    function renderParams() {
      const el = document.getElementById("params");
      el.innerHTML = "";
      sim.mcmc.attachUI(sim.mcmc, makeFolder(el));
      if (!el.children.length) {
        el.innerHTML = '<div style="font-size:13px;color:var(--color-neutral-600)">No tunable parameters.</div>';
      }
    }

    function renderNow() {
      const a = SAMPLERS.find((x) => x.id === sim.algorithm);
      document.getElementById("curName").textContent = a.name;
      document.getElementById("curDesc").textContent = a.desc;
      // keep the notes panel in sync with the running sampler
      document.getElementById("notesFull").href = "notes.html#" + sim.algorithm;
      if (document.getElementById("notesPanel").classList.contains("open")) loadNotes(sim.algorithm);
    }

    // ---------- field notes panel ----------
    const notesCache = {};
    async function loadNotes(id) {
      const body = document.getElementById("notesBody");
      if (!(id in notesCache)) {
        body.innerHTML = '<p style="color:var(--color-neutral-500)">Loading…</p>';
        try {
          const r = await fetch("notes/" + id + ".md");
          notesCache[id] = r.ok ? marked.parse(await r.text()) : null;
        } catch (e) {
          notesCache[id] = null;
        }
      }
      if (id !== sim.algorithm) return; // switched away while fetching
      body.innerHTML =
        notesCache[id] ||
        '<p style="color:var(--color-neutral-500)">No notes for this sampler yet.</p>';
      body.scrollTop = 0;
    }
    document.getElementById("notesBtn").addEventListener("click", function () {
      document.getElementById("notesPanel").classList.add("open");
      loadNotes(sim.algorithm);
    });
    document.querySelector("#notesPanel .np-close").addEventListener("click", function () {
      document.getElementById("notesPanel").classList.remove("open");
    });

    function selectSampler(id) {
      // weighted chains (nested sampling) leave chain_weights on the shared
      // mcmc object; stale weights would corrupt the next sampler's
      // histograms/stats, so clear them on every switch
      delete sim.mcmc.chain_weights;
      viz.overlayMetrics = viz.overlayLabels = null;
      evt3d = null;
      sim.setAlgorithm(id);
      renderTiles(); renderParams(); renderNow();
    }

    function updatePlay() { document.getElementById("play").textContent = sim.autoplay ? "⏸ Pause" : "▶ Play"; }

    function updateStats() {
      document.getElementById("stSteps").textContent = (sim.stepCount || 0).toLocaleString();
      const total = (sim.acceptCount || 0) + (sim.rejectCount || 0);
      let accText = total > 0 ? Math.round((100 * sim.acceptCount) / total) + "%" : "—";
      // algorithm-specific readouts from the overlay event: an "Accept" metric
      // fills the default cell (for samplers with no accept/reject events);
      // the rest render as extra stats, and prose labels as a note row
      const extra = [];
      for (const m of viz.overlayMetrics || []) {
        if (m.k === "Accept") accText = m.v;
        else extra.push(m);
      }
      const extraEl = document.getElementById("stExtra");
      const html = extra
        .map((m) => '<div class="stat"><div class="k"></div><div class="v"></div></div>')
        .join("");
      if (extraEl.childElementCount !== extra.length) extraEl.innerHTML = html;
      for (let i = 0; i < extra.length; i++) {
        extraEl.children[i].firstElementChild.textContent = extra[i].k;
        extraEl.children[i].lastElementChild.textContent = extra[i].v;
      }
      const noteEl = document.getElementById("stNote");
      const note = (viz.overlayLabels || []).join(" · ");
      noteEl.textContent = note;
      noteEl.style.display = note ? "block" : "none";
      document.getElementById("stAcc").textContent = accText;
      const chain = sim.mcmc.chain || [];
      const w = sim.mcmc.chain_weights;
      const hasW = !!(w && w.length === chain.length && chain.length > 0);
      let m0 = 0, m1 = 0, wsum = 0, w2sum = 0;
      for (let i = 0; i < chain.length; i++) {
        const wi = hasW ? w[i] : 1;
        m0 += wi * chain[i][0]; m1 += wi * chain[i][1];
        wsum += wi; w2sum += wi * wi;
      }
      if (wsum > 0) { m0 /= wsum; m1 /= wsum; }
      document.getElementById("stMean").textContent = "(" + m0.toFixed(2) + ", " + m1.toFixed(2) + ")";
      // ESS: Kish for weighted samples; integrated autocorrelation time otherwise
      let ess = "—";
      if (hasW && w2sum > 0) {
        ess = ((wsum * wsum) / w2sum).toFixed(0);
      } else if (total > 0 && chain.length > 10) {
        const tau = sim.integratedAutocorrTime(chain);
        ess = (chain.length / tau).toFixed(0);
      }
      document.getElementById("stEss").textContent = ess;
    }

    // ---------- 3D density surface (drag to rotate, auto-rotates) ----------
    const plot3d = document.getElementById("plot3d");
    let mode = "2d";
    let surf3d = null; // cached height grid, invalidated on target change
    let evt3d = null; // current step's geometry (trajectory / gradient / arrows)
    let angle = 0.7;
    const tilt = 0.74; // sin(elevation): ~48° above the plane, looking down
    let dragging3d = false, lastX3d = 0;

    // Record the engine's visualization events (the same stream the 2D
    // Visualizer consumes) so the 3D view can draw the current step's
    // geometry — trajectories, gradient arrows, proposal/accept arrows —
    // lifted onto the density surface. Only the latest step is kept, matching
    // the 2D overlay which is cleared on every proposal.
    function record3dEvent(ev) {
      const cp = (p) => [p[0], p[1]];
      const ch = sim.mcmc.chain || [];
      const last = ch.length > 1 ? cp(ch[ch.length - 2]) : ch.length ? cp(ch[ch.length - 1]) : null;
      if (ev.type === "proposal") {
        evt3d = {};
        if (ev.trajectory) evt3d.trajectory = ev.trajectory.map(cp);
        if (ev.nuts_trajectory)
          evt3d.nuts = ev.nuts_trajectory
            .filter((s) => s.from && s.to)
            .map((s) => ({ from: cp(s.from), to: cp(s.to), ok: s.type === "accept" }));
        if (ev.gradient && last)
          evt3d.gradient = { from: last, to: [last[0] + ev.gradient[0], last[1] + ev.gradient[1]] };
        if (ev.initialMomentum && last)
          evt3d.momentum = { from: last, to: [last[0] + ev.initialMomentum[0], last[1] + ev.initialMomentum[1]] };
        if (!ev.trajectory && !ev.nuts_trajectory && ev.proposal && last)
          evt3d.propLine = { from: last, to: cp(ev.proposal) };
      } else if (ev.type === "accept" || ev.type === "reject") {
        if (evt3d && last) evt3d.result = { from: last, to: cp(ev.proposal), ok: ev.type === "accept" };
      } else if (ev.type === "svgd-step") {
        // particle gradient field, scaled exactly like the 2D renderer
        evt3d = {
          svgd: ev.x.map((p, i) => {
            const n = Math.max(1e-9, Math.hypot(ev.gradx[i][0], ev.gradx[i][1]));
            const s = 0.25 / n;
            return { from: cp(p), to: [p[0] + ev.gradx[i][0] * s, p[1] + ev.gradx[i][1] * s], a: Math.min(10 * n, 1) };
          }),
        };
      }
    }

    function buildSurf() {
      const t = MCMC.targets[sim.target];
      const N = 48, Z = new Float32Array(N * N);
      const p = zeros(2, 1);
      let mx = -1e30;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        p[0] = t.xmin + ((t.xmax - t.xmin) * i) / (N - 1);
        p[1] = t.xmin + ((t.xmax - t.xmin) * j) / (N - 1);
        const v = sim.mcmc.logDensity(p);
        Z[j * N + i] = v; if (v > mx) mx = v;
      }
      // normalize to [0,1] with a soft exponent so tails stay visible
      const H = new Float32Array(N * N);
      for (let k = 0; k < Z.length; k++) H[k] = Math.pow(Math.exp(Z[k] - mx), 0.55);
      surf3d = { N, H, xmin: t.xmin, xmax: t.xmax };
    }

    function surfStops() {
      // colormap-aware ramp; 'classic' is flat so use the Broadsheet blue ramp
      if (viz.colormap !== "classic" && Colormaps.data[viz.colormap]) return Colormaps.data[viz.colormap];
      return [[233, 248, 255], [153, 224, 255], [56, 166, 207], [0, 103, 134], [10, 48, 61]];
    }
    function rampColor(stops, tt) {
      const s = Math.min(0.999, Math.max(0, tt)) * (stops.length - 1);
      const i = s | 0, f = s - i, a = stops[i], b = stops[i + 1] || a;
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
    }

    function draw3d() {
      const wrap = document.getElementById("wrap");
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = wrap.clientWidth, H = wrap.clientHeight;
      if (W === 0 || H === 0) return;
      if (plot3d.width !== W * dpr || plot3d.height !== H * dpr) {
        plot3d.width = W * dpr; plot3d.height = H * dpr;
        plot3d.style.width = W + "px"; plot3d.style.height = H + "px";
      }
      const g = plot3d.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      if (!surf3d) buildSurf();
      const S = surf3d, N = S.N;
      const M = Math.min(W, H);
      const cx = W / 2, cy = H * 0.56;
      // tilt applied once: sin(elevation) foreshortening of the ground plane —
      // a high-ish viewpoint so the floor never overlaps the peaks on screen
      const spanX = M * 0.44, spanY = M * 0.44 * tilt, hPx = M * 0.26;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const proj = (gx, gy, gz) => {
        const rx = gx * ca - gy * sa, ry = gx * sa + gy * ca;
        // d is far-ness: larger ry projects higher on screen, i.e. farther
        // from the viewer, and must be drawn FIRST (painter's algorithm)
        return { x: cx + rx * spanX, y: cy - ry * spanY - gz * hPx, d: ry };
      };
      const zAt = (i, j) => S.H[j * N + i];
      const stops = surfStops();
      const quads = [];
      for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) {
        const gx0 = (i / (N - 1)) * 2 - 1, gx1 = ((i + 1) / (N - 1)) * 2 - 1;
        const gy0 = (j / (N - 1)) * 2 - 1, gy1 = ((j + 1) / (N - 1)) * 2 - 1;
        const z00 = zAt(i, j), z10 = zAt(i + 1, j), z11 = zAt(i + 1, j + 1), z01 = zAt(i, j + 1);
        const p00 = proj(gx0, gy0, z00), p10 = proj(gx1, gy0, z10), p11 = proj(gx1, gy1, z11), p01 = proj(gx0, gy1, z01);
        quads.push({ p00, p10, p11, p01, z: (z00 + z10 + z11 + z01) / 4, d: (p00.d + p10.d + p11.d + p01.d) / 4 });
      }
      quads.sort((a, b) => b.d - a.d);
      for (const q of quads) {
        const c = rampColor(stops, q.z);
        // blend low-density quads toward the page background so the zero
        // floor reads as ground, not a solid slab; shade the peaks slightly
        const bgMix = Math.max(0, 1 - q.z * 6);
        const shade = 0.82 + 0.18 * q.z;
        const r = c[0] * shade * (1 - bgMix) + 243 * bgMix;
        const gg = c[1] * shade * (1 - bgMix) + 242 * bgMix;
        const b = c[2] * shade * (1 - bgMix) + 242 * bgMix;
        g.fillStyle = "rgb(" + (r | 0) + "," + (gg | 0) + "," + (b | 0) + ")";
        g.beginPath();
        g.moveTo(q.p00.x, q.p00.y); g.lineTo(q.p10.x, q.p10.y);
        g.lineTo(q.p11.x, q.p11.y); g.lineTo(q.p01.x, q.p01.y);
        g.closePath(); g.fill();
      }
      // chain lifted onto the surface (recent samples brighter); heights come
      // from a bilinear lookup on the cached grid — cheaper than logDensity
      const chain = sim.mcmc.chain || [];
      const start = Math.max(0, chain.length - 900);
      const span = S.xmax - S.xmin;
      const hAt = (x, y) => {
        let fi = ((x - S.xmin) / span) * (N - 1), fj = ((y - S.xmin) / span) * (N - 1);
        fi = Math.max(0, Math.min(N - 1.001, fi)); fj = Math.max(0, Math.min(N - 1.001, fj));
        const i0 = fi | 0, j0 = fj | 0, tx = fi - i0, ty = fj - j0;
        return (S.H[j0 * N + i0] * (1 - tx) + S.H[j0 * N + i0 + 1] * tx) * (1 - ty)
             + (S.H[(j0 + 1) * N + i0] * (1 - tx) + S.H[(j0 + 1) * N + i0 + 1] * tx) * ty;
      };
      for (let i = start; i < chain.length; i++) {
        const x = chain[i][0], y = chain[i][1];
        if (x < S.xmin || x > S.xmax || y < S.xmin || y > S.xmax) continue;
        const gx = ((x - S.xmin) / span) * 2 - 1, gy = ((y - S.xmin) / span) * 2 - 1;
        const pt = proj(gx, gy, hAt(x, y) + 0.015);
        g.globalAlpha = 0.15 + 0.75 * ((i - start) / Math.max(1, chain.length - start));
        g.fillStyle = "#0072b2";
        g.beginPath(); g.arc(pt.x, pt.y, 2.2, 0, 7); g.fill();
      }
      g.globalAlpha = 1;
      // current step's geometry (same events the 2D overlay draws), lifted
      // onto the surface: trajectories, NUTS tree, gradient/momentum arrows,
      // proposal and accept/reject arrows, SVGD gradient field
      if (evt3d) {
        const clampW = (v) => Math.max(S.xmin, Math.min(S.xmax, v));
        const W2S = (pt, lift) => {
          const x = clampW(pt[0]), y = clampW(pt[1]);
          const gx = ((x - S.xmin) / span) * 2 - 1, gy = ((y - S.xmin) / span) * 2 - 1;
          return proj(gx, gy, hAt(x, y) + (lift == null ? 0.02 : lift));
        };
        const seg = (a, b, color, lw, alpha) => {
          const p0 = W2S(a), p1 = W2S(b);
          g.strokeStyle = color; g.lineWidth = lw; g.globalAlpha = alpha == null ? 1 : alpha;
          g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
          g.globalAlpha = 1;
        };
        const arrow = (a, b, color, lw, alpha) => {
          const p0 = W2S(a), p1 = W2S(b);
          g.strokeStyle = color; g.lineWidth = lw; g.globalAlpha = alpha == null ? 1 : alpha;
          g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y);
          const t = Math.atan2(p1.y - p0.y, p1.x - p0.x) + Math.PI, s = 7;
          g.moveTo(p1.x + s * Math.cos(t + Math.PI / 8), p1.y + s * Math.sin(t + Math.PI / 8));
          g.lineTo(p1.x, p1.y);
          g.lineTo(p1.x + s * Math.cos(t - Math.PI / 8), p1.y + s * Math.sin(t - Math.PI / 8));
          g.stroke(); g.globalAlpha = 1;
        };
        if (evt3d.svgd) for (const v of evt3d.svgd) arrow(v.from, v.to, "rgba(30,30,30,0.85)", 1, v.a);
        if (evt3d.momentum) arrow(evt3d.momentum.from, evt3d.momentum.to, "#999", 1);
        if (evt3d.gradient) arrow(evt3d.gradient.from, evt3d.gradient.to, "#0099cc", 1.5);
        if (evt3d.propLine) arrow(evt3d.propLine.from, evt3d.propLine.to, "#999", 1);
        if (evt3d.trajectory && evt3d.trajectory.length > 1) {
          g.strokeStyle = "#333"; g.lineWidth = 1.5;
          g.beginPath();
          let p0 = W2S(evt3d.trajectory[0]);
          g.moveTo(p0.x, p0.y);
          for (let i = 1; i < evt3d.trajectory.length; i++) {
            const p1 = W2S(evt3d.trajectory[i]);
            g.lineTo(p1.x, p1.y);
          }
          g.stroke();
        }
        if (evt3d.nuts) for (const s2 of evt3d.nuts) seg(s2.from, s2.to, s2.ok ? "#0099cc" : "#d55e00", 1, 0.9);
        if (evt3d.result) arrow(evt3d.result.from, evt3d.result.to, evt3d.result.ok ? "#0072b2" : "#d55e00", 2);
      }
      if (chain.length) {
        const cpt = chain[chain.length - 1];
        if (cpt[0] >= S.xmin && cpt[0] <= S.xmax && cpt[1] >= S.xmin && cpt[1] <= S.xmax) {
          const gx = ((cpt[0] - S.xmin) / span) * 2 - 1, gy = ((cpt[1] - S.xmin) / span) * 2 - 1;
          const pt = proj(gx, gy, hAt(cpt[0], cpt[1]) + 0.02);
          g.fillStyle = "#fff"; g.strokeStyle = "#0072b2"; g.lineWidth = 2;
          g.beginPath(); g.arc(pt.x, pt.y, 4.2, 0, 7); g.fill(); g.stroke();
        }
      }
      if (!dragging3d) angle += 0.004;
    }

    function setMode(m) {
      mode = m;
      document.getElementById("btn2d").classList.toggle("on", m === "2d");
      document.getElementById("btn3d").classList.toggle("on", m === "3d");
      document.getElementById("plotCanvas").style.display = m === "2d" ? "block" : "none";
      plot3d.style.display = m === "3d" ? "block" : "none";
      document.getElementById("hint").textContent =
        m === "3d" ? "3D density surface · drag to rotate" : "Proposals, trajectories & gradients rendered live by the MCMC engine";
    }

    function initApp() {
      viz = new Visualizer(document.getElementById("plotCanvas"));
      viz.container = document.getElementById("wrap");
      sim = new Simulation();
      sim.visualizer = viz;
      viz.simulation = sim;
      viz.colormap = "classic"; // flat-blue density, matching the Broadsheet accent
      viz.showDiagnostics = false; // stats shown in our own #statsBox instead
      viz.drawOverlayLabels = false; // overlay metrics/notes go to #statsBox too

      // tap the visualization event stream for the 3D overlay: record each
      // event just before the 2D Visualizer consumes it
      const origDequeue = viz.dequeue.bind(viz);
      viz.dequeue = function () {
        if (viz.queue.length) {
          try { record3dEvent(viz.queue[0]); } catch (e) {}
        }
        return origDequeue();
      };

      // honour ?algorithm=&target= links from the gallery page
      const q = new URLSearchParams(window.location.search);
      let qa = q.get("algorithm");
      const qt = q.get("target");
      if (qa && LEGACY_IDS[qa]) qa = LEGACY_IDS[qa];
      const algo = qa && MCMC.algorithms[qa] ? qa : "HamiltonianMC";
      const target = qt && MCMC.targets[qt] ? qt : "banana";

      sim.setAlgorithm(algo);
      sim.setTarget(target);

      renderTiles(); renderTargets(); renderParams(); renderNow(); updatePlay();
      setMode("2d");

      // simulation controls
      const delayEl = document.getElementById("delay");
      delayEl.value = sim.delay;
      document.getElementById("delayVal").textContent = sim.delay + " ms";
      delayEl.addEventListener("input", () => {
        sim.delay = +delayEl.value;
        document.getElementById("delayVal").textContent = sim.delay + " ms";
        viz.animateProposal = sim.delay > 0;
      });
      const cmapEl = document.getElementById("cmap");
      Colormaps.names.forEach((n) => {
        const o = document.createElement("option");
        o.value = n; o.textContent = n; o.selected = n === viz.colormap;
        cmapEl.appendChild(o);
      });
      cmapEl.addEventListener("change", () => {
        viz.colormap = cmapEl.value;
        sim.buildDensityImage();
        viz.redrawDensity();
      });
      document.getElementById("play").addEventListener("click", () => { sim.autoplay = !sim.autoplay; updatePlay(); });
      document.getElementById("step").addEventListener("click", () => sim.step());
      document.getElementById("reset").addEventListener("click", () => { evt3d = null; sim.reset(); });
      document.getElementById("savePNG").addEventListener("click", () => {
        if (mode === "3d") {
          const a = document.createElement("a");
          a.download = "sampling-gallery-" + sim.algorithm + "-" + sim.target + "-3d.png";
          a.href = plot3d.toDataURL("image/png");
          a.click();
        } else viz.savePNG();
      });

      // rail hide / show
      document.getElementById("hideRail").addEventListener("click", () => {
        document.getElementById("app").classList.add("railHidden");
        document.getElementById("reopen").style.display = "inline-block";
        viz.resize();
      });
      document.getElementById("reopen").addEventListener("click", () => {
        document.getElementById("app").classList.remove("railHidden");
        document.getElementById("reopen").style.display = "none";
        viz.resize();
      });

      // 2D / 3D view toggle
      document.getElementById("btn2d").addEventListener("click", () => setMode("2d"));
      document.getElementById("btn3d").addEventListener("click", () => setMode("3d"));
      plot3d.addEventListener("pointerdown", (e) => { dragging3d = true; lastX3d = e.clientX; plot3d.setPointerCapture(e.pointerId); });
      plot3d.addEventListener("pointermove", (e) => { if (dragging3d) { angle += (e.clientX - lastX3d) * 0.008; lastX3d = e.clientX; } });
      plot3d.addEventListener("pointerup", () => { dragging3d = false; });

      window.onresize = function () { viz.resize(); };
      setInterval(updateStats, 250);
      (function loop3d() { if (mode === "3d") draw3d(); requestAnimationFrame(loop3d); })();
      sim.animate();
    }

    // Replaces the window.onload that Simulation.js installs (which builds the
    // lil-gui panel for app.html). Init is deferred until the layout has real
    // dimensions: in some embedded contexts the container still measures 0x0
    // at the load event, and the engine's resize()/render() cannot work with
    // zero-sized canvases.
    window.onload = function () {
      const wrap = document.getElementById("wrap");
      (function waitForLayout() {
        if (wrap.clientWidth > 0 && wrap.clientHeight > 0) initApp();
        else requestAnimationFrame(waitForLayout);
      })();
    };
  </script>
</body>
</html>
